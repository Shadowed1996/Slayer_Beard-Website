# Il progetto non ha dipendenze esterne: solo i moduli interni di Node.js
# (CONTRATTO §0). Il `package.json` c'è per l'avvio su un hosting con Node e
# per i metadati, e non elenca nessun pacchetto: non c'è niente da aggiornare.
# Resta quindi il solo ecosistema delle GitHub Actions usate dai workflow.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
