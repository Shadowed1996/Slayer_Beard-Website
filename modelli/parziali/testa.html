<!-- Il <head> della home. Quello che vale per tutte le pagine (codifica, CSP,
     icona, font, immagine social) sta in parziali/testa-comune.html: qui restano
     solo le cose che parlano di QUESTA pagina — il titolo, la descrizione, il
     proprio indirizzo e la scheda strutturata del canale. -->
{{> parziali/testa-comune}}

<title>{{meta.titolo}}</title>
<meta name="description" content="{{meta.descrizione}}">
<!-- Canonico: assoluto se il sito ha un indirizzo pubblico (campo «Indirizzo pubblico del sito»),
     altrimenti "./", che si risolve sull'indirizzo da cui la pagina viene servita. -->
{{#se config.sitoUrl}}<link rel="canonical" href="{{config.sitoUrl}}">{{/se}}{{^se config.sitoUrl}}<link rel="canonical" href="./">{{/se}}

<meta property="og:title" content="{{meta.titolo}}">
<meta property="og:description" content="{{meta.ogDescrizione}}">
{{#se config.sitoUrl}}<meta property="og:url" content="{{config.sitoUrl}}">{{/se}}{{^se config.sitoUrl}}<meta property="og:url" content="./">{{/se}}

<meta name="twitter:title" content="{{meta.titolo}}">
<meta name="twitter:description" content="{{meta.ogDescrizione}}">

<!-- La scheda strutturata è costruita in server/lib/costruisci.js e serializzata con
     jsonSicuro(). Qui ci vuole la tripla graffa: dentro uno <script> il contenuto è raw text,
     nessuno decodifica le entità HTML, e con la doppia graffa un apostrofo in un testo
     finirebbe indicizzato da Google come &#39;. L'escape giusto è quello JSON, non quello
     HTML — e passando da JavaScript sameAs si deduplica e i campi vuoti spariscono.

     Sta solo qui e non nella pagina delle clip: descrive la persona e il canale, e la
     persona e il canale sono questa pagina. Ripeterla altrove vorrebbe dire dichiarare
     due volte la stessa cosa a chi legge i dati strutturati. -->
<script type="application/ld+json">
{{{sito.jsonLd}}}
</script>
