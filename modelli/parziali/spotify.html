<aside id="spotify" class="spotify spotify--{{sito.spotify.formato}}" aria-label="Spotify" data-aperto="{{#se sito.spotify.aperto}}1{{/se}}{{^se sito.spotify.aperto}}0{{/se}}" data-segui="{{#se sito.spotify.segui}}1{{/se}}{{^se sito.spotify.segui}}0{{/se}}" data-ascolta="{{sito.spotify.ascolta}}" hidden>
  <div id="spotify-riquadro" class="spotify__riquadro">
    <div class="spotify__testa">
      <span class="spotify__titolo">{{sito.spotify.titolo}}</span>
      <button id="spotify-riduci" class="spotify__riduci" type="button" aria-label="{{sito.spotify.nascondi}}" title="{{sito.spotify.nascondi}}" aria-controls="spotify-riquadro" aria-expanded="true"></button>
    </div>
    <p class="spotify__ora" hidden></p>
    <button class="spotify__passa" type="button" hidden>{{sito.spotify.passa}}</button>
    <iframe class="spotify__player" title="{{sito.spotify.titolo}} · Spotify" data-src="{{sito.spotify.src}}" width="100%" height="{{sito.spotify.alto}}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>
  <button id="spotify-apri" class="spotify__apri" type="button" aria-label="{{sito.spotify.mostra}}" title="{{sito.spotify.mostra}}" aria-controls="spotify-riquadro" aria-expanded="false">
    <svg class="spotify__logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Zm4.82 15.15a.66.66 0 0 1-.9.22c-2.47-1.51-5.58-1.85-9.24-1.01a.66.66 0 1 1-.29-1.28c4-.92 7.44-.52 10.21 1.17.31.19.41.6.22.9Zm1.28-2.86a.82.82 0 0 1-1.13.27c-2.83-1.74-7.14-2.24-10.49-1.23a.82.82 0 1 1-.48-1.57c3.83-1.16 8.58-.6 11.83 1.4.39.24.51.75.27 1.13Zm.11-2.98C14.82 8.8 9.2 8.61 5.95 9.6a.99.99 0 1 1-.57-1.89c3.73-1.13 9.94-.91 13.85 1.41a.99.99 0 1 1-1.02 1.7Z"/></svg>
  </button>
</aside>
