<section id="supporto" class="supporto" aria-labelledby="supporto-titolo" data-sb-sezione="supporto" data-sb-riquadro="supporto">
  <div class="sezione__testa" data-sb-blocco="supporto.testa">
    <p class="sezione__occhiello" data-sb-testo="supporto.occhiello">{{supporto.occhiello}}</p>
    <h2 id="supporto-titolo" class="sezione__titolo" data-sb-testo="supporto.titolo">{{supporto.titolo}}</h2>
    <p class="sezione__testo" data-sb-testo="supporto.testo">{{{supporto.testo}}}</p>
  </div>

  <!-- Le voci senza URL sono già state tolte dalla generazione: qui non arriva niente di rotto. -->
  <ol id="listino" class="listino" data-sb-parte="listino" data-sb-blocco="supporto.listino">
    {{#ogni supporto}}
    <li class="listino__riga">
      <span class="listino__icona">{{{svg}}}</span>
      <div class="listino__corpo">
        <h3 class="listino__titolo">{{titolo}}</h3>
        <p class="listino__testo">{{{testo}}}</p>
      </div>
      <span class="listino__tag">{{tag}}</span>
      <a class="listino__azione" href="{{url}}" target="_blank" rel="noopener">{{cta}}</a>
    </li>
    {{/ogni}}
  </ol>

  <p class="supporto__chiusura" data-sb-testo="supporto.chiusura" data-sb-blocco="supporto.chiusura">{{{supporto.chiusura}}}</p>
</section>
