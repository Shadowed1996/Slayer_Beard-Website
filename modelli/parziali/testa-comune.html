<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' https://embed.twitch.tv;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  media-src 'self' blob:;
  img-src 'self' data: https://static-cdn.jtvnw.net https://clips-media-assets2.twitch.tv https://clips-media-assets.twitch.tv;
  frame-src https://player.twitch.tv https://www.twitch.tv https://embed.twitch.tv;
  connect-src 'self' https://api.twitch.tv https://id.twitch.tv wss://irc-ws.chat.twitch.tv;
  base-uri 'self';
  form-action 'none';
  object-src 'none'">

<meta name="author" content="{{marchio.nome}}">

<link rel="icon" href="{{config.immagini.favicon}}" type="image/png">
<link rel="apple-touch-icon" href="{{config.immagini.favicon}}">

<meta property="og:type" content="website">
<meta property="og:image" content="{{sito.ogImmagine}}">
<meta property="og:image:alt" content="{{meta.ogImmagineAlt}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">

{{#se sito.fontUrl}}<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{sito.fontUrl}}">{{/se}}
{{#se sito.ingresso.attivo}}<link rel="stylesheet" href="css/ingresso.css">
<script src="js/ingresso.js" data-durata="{{sito.ingresso.durata}}" data-minimo="{{sito.ingresso.minimo}}"></script>{{/se}}
