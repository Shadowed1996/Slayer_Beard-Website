<aside id="musica" class="musica" aria-label="{{sito.musica.titolo}}" data-aperto="{{#se sito.musica.aperto}}1{{/se}}{{^se sito.musica.aperto}}0{{/se}}" hidden>
  <div id="musica-riquadro" class="musica__riquadro">
    <span class="musica__tinta" aria-hidden="true"></span>
    <div class="musica__testa">
      <span class="musica__occhiello">{{sito.musica.titolo}}</span>
      <span id="musica-conta" class="musica__conta"></span>
      <button id="musica-riduci" class="musica__riduci" type="button" aria-label="{{sito.musica.riduci}}" title="{{sito.musica.riduci}}" aria-controls="musica-riquadro" aria-expanded="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 10 6 6 6-6"/></svg>
      </button>
    </div>

    <div class="musica__traccia">
      <span class="musica__pochette" aria-hidden="true">
        <span class="musica__vinile">
          <span class="musica__solco"></span>
          <span class="musica__bollino"></span>
        </span>
        <img id="musica-cover" class="musica__cover" src="" alt="" width="68" height="68" hidden>
      </span>
      <button id="musica-elenco-apri" class="musica__etichette" type="button" aria-controls="musica-elenco" aria-expanded="false" aria-label="{{sito.musica.elenco}}" title="{{sito.musica.elenco}}">
        <span class="musica__scorri"><span id="musica-titolo" class="musica__titolo"></span></span>
        <span id="musica-artista" class="musica__artista"></span>
      </button>
    </div>

    <div class="musica__avanzamento">
      <span class="musica__onda">
        <canvas id="musica-tela" class="musica__tela" width="600" height="96" aria-hidden="true"></canvas>
        <input id="musica-cursore" class="musica__cursore" type="range" min="0" max="1000" value="0" step="1" aria-label="{{sito.musica.avanzamento}}" disabled>
      </span>
      <span class="musica__tempi"><span id="musica-trascorso">0:00</span><span class="musica__sbarra" aria-hidden="true">/</span><span id="musica-durata">0:00</span></span>
    </div>

    <div class="musica__comandi">
      <button id="musica-casuale" class="musica__btn musica__btn--casuale" type="button" aria-label="{{sito.musica.casuale}}" title="{{sito.musica.casuale}}" aria-pressed="false">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7h3.2a3 3 0 0 1 2.5 1.3l6.6 9.4a3 3 0 0 0 2.5 1.3H21"/><path d="M3 17h3.2a3 3 0 0 0 2.5-1.3l1.5-2.2"/><path d="m13.3 10.5 1.5-2.2A3 3 0 0 1 17.3 7H21"/><path d="m18.5 4.5 2.5 2.5-2.5 2.5"/><path d="m18.5 16.5 2.5 2.5-2.5 2.5"/></svg>
      </button>

      <button id="musica-precedente" class="musica__btn" type="button" aria-label="{{sito.musica.precedente}}" title="{{sito.musica.precedente}}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6.5v11a.7.7 0 0 1-1.1.6l-7.6-5.5a.7.7 0 0 1 0-1.2l7.6-5.5a.7.7 0 0 1 1.1.6Z"/><path d="M6.5 6v12"/></svg>
      </button>

      <button id="musica-play" class="musica__btn musica__btn--play" type="button" aria-label="{{sito.musica.play}}" title="{{sito.musica.play}}">
        <span class="musica__ico musica__ico--play">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 5.7v12.6a.7.7 0 0 0 1.1.6l9.2-6.3a.7.7 0 0 0 0-1.2L9.1 5.1A.7.7 0 0 0 8 5.7Z"/></svg>
        </span>
        <span class="musica__ico musica__ico--pausa">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 5v14"/><path d="M15 5v14"/></svg>
        </span>
      </button>

      <button id="musica-successiva" class="musica__btn" type="button" aria-label="{{sito.musica.successiva}}" title="{{sito.musica.successiva}}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6.5v11a.7.7 0 0 0 1.1.6l7.6-5.5a.7.7 0 0 0 0-1.2L7.1 5.9A.7.7 0 0 0 6 6.5Z"/><path d="M17.5 6v12"/></svg>
      </button>

      <span class="musica__suono">
        <button id="musica-muto" class="musica__btn musica__btn--muto" type="button" aria-label="{{sito.musica.muto}}" title="{{sito.musica.muto}}">
          <span class="musica__ico musica__ico--suono">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 4.8 6.8 8.5H4.2a.7.7 0 0 0-.7.7v5.6c0 .4.3.7.7.7h2.6l4.2 3.7a.7.7 0 0 0 1.2-.5V5.3a.7.7 0 0 0-1.2-.5Z"/><path d="M16.2 9.2a4 4 0 0 1 0 5.6"/><path d="M18.8 6.6a7.6 7.6 0 0 1 0 10.8"/></svg>
          </span>
          <span class="musica__ico musica__ico--muto">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 4.8 6.8 8.5H4.2a.7.7 0 0 0-.7.7v5.6c0 .4.3.7.7.7h2.6l4.2 3.7a.7.7 0 0 0 1.2-.5V5.3a.7.7 0 0 0-1.2-.5Z"/><path d="m16.5 9.5 4 5"/><path d="m20.5 9.5-4 5"/></svg>
          </span>
        </button>
        <input id="musica-livello" class="musica__livello" type="range" min="0" max="100" value="70" step="1" aria-label="{{sito.musica.volume}}">
      </span>
    </div>

    <ul id="musica-elenco" class="musica__elenco" hidden></ul>

    <p id="musica-stato" class="musica__stato" role="status" aria-live="polite"></p>
    <audio id="musica-audio" preload="none"></audio>
  </div>

  <button id="musica-apri" class="musica__apri{{#se sito.musica.icona}} musica__apri--immagine{{/se}}" type="button" aria-label="{{sito.musica.apri}}" title="{{sito.musica.apri}}" aria-controls="musica-riquadro" aria-expanded="false">
    {{#se sito.musica.icona}}<img class="musica__apri-immagine" src="{{sito.musica.icona}}" alt="" loading="lazy" decoding="async">{{/se}}{{^se sito.musica.icona}}<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18V6.2a.8.8 0 0 1 .6-.8l8-1.8a.6.6 0 0 1 .7.6V15"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="15.8" cy="15" r="2.5"/></svg>{{/se}}
  </button>
</aside>
