<aside id="binario" class="binario" data-sb-sezione="binario">
  <a class="binario__marchio" href="#regia">
    <img class="binario__avatar" src="{{config.immagini.avatar}}" alt="" aria-hidden="true" width="40" height="40" decoding="async" data-sb-immagine="config.immagini.avatar">
    <span class="binario__nome" data-sb-testo="marchio.nome">{{marchio.nome}}</span>
  </a>

  <nav class="binario__nav" aria-label="Sezioni">{{#ogni sito.voci}}
    <a class="binario__voce" href="#{{id}}">
      <span class="binario__punto" aria-hidden="true"></span><span class="binario__testo" data-sb-testo="{{chiave}}">{{testo}}</span>
    </a>{{/ogni}}
  </nav>

  <p class="binario__stato">
    <span id="spia" class="spia" aria-hidden="true"></span><span id="spia-testo" class="binario__stato-testo" data-sb-testo="deck.statoVerifica">{{deck.statoVerifica}}</span>
  </p>

  <ul class="binario__social" data-sb-parte="social">
    {{#ogni social}}
    <li>
      <a class="binario__social-voce" href="{{url}}" aria-label="{{nome}}" target="_blank" rel="noopener">{{{svg}}}</a>
    </li>
    {{/ogni}}
  </ul>
</aside>
